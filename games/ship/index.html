<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03090c" />
    <title>Rocket · First flight</title>
    <link rel="stylesheet" href="../../src/virtual-controls.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "production-workshop": "../../dist/vendor/production-workshop-2.4.0/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="game" aria-label="Space flight">
      <div id="viewport"></div>
      <div id="flight-feedback" role="status" aria-live="polite"></div>
      <nav aria-label="Cockpit controls">
        <button id="systems" type="button" disabled>
          Systems <kbd>I</kbd>
        </button>
        <button id="menu-button" type="button" disabled>
          Menu <kbd>Esc</kbd>
        </button>
      </nav>
      <div id="touch-controls" hidden></div>
      <section id="entry" class="scene-panel" aria-labelledby="entry-title">
        <div class="entry-card">
          <p class="eyebrow">ROCKET</p>
          <h1 id="entry-title">First flight</h1>
          <p id="loading" role="status">Bringing the ship online…</p>
          <button id="fly" class="primary" type="button" disabled>
            Launch
          </button>
          <button id="open-settings" type="button" disabled>Settings</button>
          <p id="menu-note" class="muted">Your ship. Your way home.</p>
        </div>
      </section>
      <section
        id="settings-scene"
        class="scene-panel"
        aria-labelledby="settings-title"
        hidden
      >
        <div class="settings-card">
          <header>
            <div>
              <p class="eyebrow">FIRST FLIGHT / SETTINGS</p>
              <h1 id="settings-title">Controls</h1>
            </div>
            <button id="settings-back" type="button">Back to menu</button>
          </header>
          <div class="settings-content">
            <p class="muted">
              Flight is paused. Changes take effect when you apply them.
            </p>
            <div class="preferences">
              <label
                >Steering
                <select id="steering">
                  <option value="mouse">Mouse + keyboard</option>
                  <option value="keyboard">Keyboard</option>
                </select></label
              >
              <label
                >Mouse sensitivity
                <span class="range-line"
                  ><input
                    id="sensitivity"
                    type="range"
                    min="0.1"
                    max="3"
                    step="0.1"
                    value="1"
                  /><output for="sensitivity">1.0×</output></span
                ></label
              >
              <label class="check"
                ><input id="invert-pitch" type="checkbox" /> Invert mouse
                pitch</label
              >
              <label
                >Virtual controllers
                <select id="virtual-controls">
                  <option value="off">Off</option>
                  <option value="analog">Analog sticks</option>
                  <option value="digital">Digital pads</option>
                </select></label
              >
            </div>
            <h2>Bindings</h2>
            <p class="muted">
              Select a binding to replace it, or + to add an alternative. Escape
              opens the menu.
            </p>
            <div id="bindings"></div>
          </div>
          <footer>
            <p role="status" aria-live="polite"></p>
            <div>
              <button id="reset-controls" type="button">
                Restore defaults
              </button>
              <button id="apply-controls" class="primary" type="button">
                Apply controls
              </button>
            </div>
          </footer>
        </div>
      </section>
    </main>
    <script type="module" src="../../dist/games/ship/main.js"></script>
  </body>
</html>
