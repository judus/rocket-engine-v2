name: Preview CI and deployment

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      archive_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Record checked revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Complete quality gate
        run: npm run check
      - name: Package merged main revision
        id: package
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run package:preview
          archive="$PWD/build/rocket-preview-$RELEASE_SHA.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=u=rwX,go=rX -czf "$archive" -C build/preview/site . -C "$PWD/build/preview" release.json
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain checked deployment artifact
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocket-preview-${{ steps.revision.outputs.sha }}
          path: build/rocket-preview-${{ steps.revision.outputs.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy previews
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://farwake.maduser.net
    concurrency:
      group: rocket-preview-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment client at the checked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.revision }}
          persist-credentials: false
      - name: Retire superseded merged revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.quality.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this release will not replace it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download exact checked artifact
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rocket-preview-${{ needs.quality.outputs.revision }}
          path: release
      - name: Upload and activate both static previews
        if: steps.current.outputs.eligible == 'true'
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.revision }}
          ARCHIVE_SHA256: ${{ needs.quality.outputs.archive_sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: bash .github/scripts/deploy-preview.sh "release/rocket-preview-$RELEASE_SHA.tar.gz"
